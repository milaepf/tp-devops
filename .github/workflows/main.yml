name: CI devops 2025

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simpleapi/pom.xml

      - name: Generate version
        id: version
        run: |
          echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version
        run: |
          mvn -B versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false \
            --file ./simpleapi/pom.xml

      - name: Build and test with Maven
        run: mvn -B clean verify --file ./simpleapi/pom.xml

      - name: SonarCloud Analysis
        run: mvn -B verify
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
            -Dsonar.projectKey=milaepf_tp-devops
            -Dsonar.organization=milaepf
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.token=$SONAR_TOKEN
            -Dsonar.qualitygate.wait=true
            --file ./simpleapi/pom.xml

  build-and-push-docker-image:
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate version
        id: version
        run: |
          echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version
        run: |
          mvn -B versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false \
            --file ./simpleapi/pom.xml

      - name: Build application
        run: mvn -B clean package -DskipTests --file ./simpleapi/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simpleapi:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simpleapi:latest
          push: true

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: true

      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:latest
          push: true
