name: CI devops 2025

on:
  # Lancer la CI lors d'un push sur main ou develop
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # Récupérer le code du dépôt
      - uses: actions/checkout@v4

      # Installer le JDK 21 et activer le cache Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Construire l'application et exécuter les tests
      - name: Build and test with Maven
        run: mvn clean verify --file ./simpleapi/pom.xml 


  # Partie CD : construire et publier les images Docker
  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Préparer l'environnement de construction Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v6

      # Se connecter uniquement pour publier depuis main
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire l'image de l'API Java
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simpleapi:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Construire l'image de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Construire l'image du serveur HTTP Apache
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}